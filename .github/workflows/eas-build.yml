name: EAS Build — Mobile App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
    paths:
      - "artifacts/field-app/**"

jobs:
  build-android:
    name: Build Android (${{ github.event.inputs.profile || 'preview' }})
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    defaults:
      run:
        working-directory: artifacts/field-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set commit status — pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'EAS Build / Android',
              description: 'Building Android app via EAS...',
            });

      - name: Build Android
        id: eas_build
        run: |
          BUILD_PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Building with profile: $BUILD_PROFILE"

          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile "$BUILD_PROFILE" \
            --non-interactive \
            --json 2>&1) || true

          echo "$BUILD_OUTPUT"

          # Extract build URL from JSON output
          BUILD_URL=$(echo "$BUILD_OUTPUT" | grep -o 'https://expo.dev/accounts/[^"]*' | head -1 || true)
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"

          # Check if build was successful
          if echo "$BUILD_OUTPUT" | grep -q '"status":"FINISHED"'; then
            echo "build_status=success" >> "$GITHUB_OUTPUT"
          elif echo "$BUILD_OUTPUT" | grep -q '"status":"BUILD_ERROR"'; then
            echo "build_status=error" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "build_status=queued" >> "$GITHUB_OUTPUT"
          fi
        env:
          EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}

      - name: Post commit status — success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = '${{ steps.eas_build.outputs.build_url }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'EAS Build / Android',
              description: 'Android build completed — click Details',
              target_url: buildUrl || 'https://expo.dev',
            });

      - name: Post commit status — failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'EAS Build / Android',
              description: 'Android build failed — check Actions logs',
            });

  build-ios:
    name: Build iOS (${{ github.event.inputs.profile || 'preview' }})
    if: >-
      github.event.inputs.platform == 'ios' ||
      github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    defaults:
      run:
        working-directory: artifacts/field-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set commit status — pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'EAS Build / iOS',
              description: 'Building iOS app via EAS...',
            });

      - name: Build iOS
        id: eas_build
        run: |
          BUILD_PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "Building with profile: $BUILD_PROFILE"

          eas build \
            --platform ios \
            --profile "$BUILD_PROFILE" \
            --non-interactive
        env:
          EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}

      - name: Post commit status — success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'EAS Build / iOS',
              description: 'iOS build completed — click Details',
              target_url: 'https://expo.dev',
            });

      - name: Post commit status — failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'EAS Build / iOS',
              description: 'iOS build failed — check Actions logs',
            });
