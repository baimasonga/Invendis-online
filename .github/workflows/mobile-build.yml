name: Mobile Static Bundle (Expo Go)

on:
  push:
    branches: [main]
    paths:
      - "artifacts/field-app/**"
      - "artifacts/api-server/src/routes/auth.ts"
      - "artifacts/api-server/src/routes/dispatch.ts"
      - "artifacts/api-server/src/routes/farmers.ts"
      - "artifacts/api-server/src/routes/delivery-farmers.ts"
      - "artifacts/api-server/src/routes/delivery-guard.ts"
      - "artifacts/api-server/src/routes/gps.ts"
      - "artifacts/api-server/src/routes/pod.ts"
      - "artifacts/api-server/src/lib/dispatch-auth.ts"
      - "artifacts/api-server/src/lib/gpstrace.ts"
      - "artifacts/api-server/src/lib/pod-gps.ts"
      - "supabase/migrations/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-static-build:
    name: Static Bundle (Expo Go)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}
      REPLIT_DEV_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}
      EXPO_PUBLIC_REPL_ID: ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck field app
        run: pnpm --filter @workspace/field-app run typecheck

      - name: Build static bundle
        run: pnpm --filter @workspace/field-app run build

      - name: Verify build output
        run: |
          test -d artifacts/field-app/static-build
          test -f artifacts/field-app/static-build/index.html
          test -d artifacts/field-app/static-build/android
          test -f artifacts/field-app/static-build/android/manifest.json

      - name: Upload static build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: field-app-static-build-${{ github.run_number }}
          path: artifacts/field-app/static-build
          if-no-files-found: error
          retention-days: 14
