name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "artifacts/field-app/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:
    inputs:
      domain:
        description: "API domain override (leave blank to use EXPO_PUBLIC_DOMAIN var)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build composite libs
        run: pnpm run typecheck:libs

      - name: Typecheck field app
        run: pnpm --filter @workspace/field-app run typecheck

  build-apk:
    name: Build APK (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        working-directory: artifacts/field-app
        run: |
          pnpm exec expo prebuild \
            --platform android \
            --clean \
            --skip-dependency-update expo \
            --skip-dependency-update react \
            --skip-dependency-update react-native
        env:
          CI: "1"
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          http_proxy: ""
          https_proxy: ""
          all_proxy: ""

      - name: Prepare signing keystore
        id: signing
        working-directory: artifacts/field-app/android/app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "store_file=$GITHUB_WORKSPACE/artifacts/field-app/android/app/release.keystore" >> $GITHUB_OUTPUT
            echo "store_password=$STORE_PASS" >> $GITHUB_OUTPUT
            echo "key_alias=$KEY_ALIAS" >> $GITHUB_OUTPUT
            echo "key_password=$KEY_PASS" >> $GITHUB_OUTPUT
            echo "signed=production" >> $GITHUB_OUTPUT
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass invendis123 -keypass invendis123 \
              -dname "CN=Invendis Field, OU=Mobile, O=Invendis, L=Freetown, S=Western, C=SL" \
              2>/dev/null || true
            echo "store_file=$GITHUB_WORKSPACE/artifacts/field-app/android/app/release.keystore" >> $GITHUB_OUTPUT
            echo "store_password=invendis123" >> $GITHUB_OUTPUT
            echo "key_alias=release" >> $GITHUB_OUTPUT
            echo "key_password=invendis123" >> $GITHUB_OUTPUT
            echo "signed=debug-keystore" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK
        working-directory: artifacts/field-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            "-Pandroid.injected.signing.store.file=${{ steps.signing.outputs.store_file }}" \
            "-Pandroid.injected.signing.store.password=${{ steps.signing.outputs.store_password }}" \
            "-Pandroid.injected.signing.key.alias=${{ steps.signing.outputs.key_alias }}" \
            "-Pandroid.injected.signing.key.password=${{ steps.signing.outputs.key_password }}"
        env:
          EXPO_PUBLIC_DOMAIN: ${{ inputs.domain || vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}

      - name: Locate APK
        id: apk
        run: |
          APK=$(find artifacts/field-app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found" && exit 1
          fi
          VER=$(node -p "require('./artifacts/field-app/app.json').expo.version")
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NAME="invendis-field-v${VER}-${SHA}.apk"
          cp "$APK" "$NAME"
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-v${{ steps.apk.outputs.version }}-build${{ github.run_number }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: field-app-v${{ steps.apk.outputs.version }}-${{ github.run_number }}
          name: "Invendis Field App v${{ steps.apk.outputs.version }} (#${{ github.run_number }})"
          body: |
            ## Invendis Field App - Android APK
            | Field | Value |
            |-------|-------|
            | Version | `${{ steps.apk.outputs.version }}` |
            | Build | `#${{ github.run_number }}` |
            | Commit | `${{ github.sha }}` |
            | Signing | `${{ steps.signing.outputs.signed }}` |
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
