name: EAS Build — Android (Manual)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      wait_for_build:
        description: "Wait for build to complete and fetch APK URL"
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build Android (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: artifacts/field-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run Expo Doctor (pre-build check)
        run: npx expo-doctor || true

      - name: Build Android
        id: eas_build
        run: |
          WAIT_FLAG=""
          if [ "${{ github.event.inputs.wait_for_build }}" = "true" ]; then
            WAIT_FLAG="--wait"
          else
            WAIT_FLAG="--no-wait"
          fi

          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            $WAIT_FLAG
        env:
          EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}

      - name: Get latest build URL
        if: github.event.inputs.wait_for_build == 'true'
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List recent builds
          eas build:list --platform android --limit 1 --json | tee build-info.json

          echo "### Latest Build Info" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat build-info.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
