name: Build Mobile App — Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab
  push:
    branches:
      - main
    paths:
      - "artifacts/field-app/**"

jobs:
  build-android:
    name: Build Android (${{ github.event.inputs.build_type || 'apk' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    defaults:
      run:
        working-directory: artifacts/field-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/field-app/android/**/*.gradle*', 'artifacts/field-app/android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}

      - name: Build APK
        if: github.event.inputs.build_type != 'aab'
        working-directory: artifacts/field-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build AAB (App Bundle)
        if: github.event.inputs.build_type == 'aab'
        working-directory: artifacts/field-app/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        if: github.event.inputs.build_type != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: invendis-field-app-${{ github.sha }}
          path: artifacts/field-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        if: github.event.inputs.build_type == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: invendis-field-app-bundle-${{ github.sha }}
          path: artifacts/field-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Post commit status — success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Mobile Build / Android',
              description: 'Android build completed — download from Artifacts',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Post commit status — failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'Mobile Build / Android',
              description: 'Android build failed — check Actions logs',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
