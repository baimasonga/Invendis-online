name: Build Mobile App — iOS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "simulator"
        type: choice
        options:
          - simulator
          - device

jobs:
  build-ios:
    name: Build iOS (${{ github.event.inputs.build_type }})
    runs-on: macos-latest
    defaults:
      run:
        working-directory: artifacts/field-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: artifacts/field-app/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('artifacts/field-app/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_PUBLIC_DOMAIN: ${{ vars.EXPO_PUBLIC_DOMAIN || 'www.invendisapp.com' }}

      - name: Install CocoaPods
        working-directory: artifacts/field-app/ios
        run: pod install

      - name: Build for Simulator
        if: github.event.inputs.build_type == 'simulator'
        working-directory: artifacts/field-app/ios
        run: |
          xcodebuild \
            -workspace fieldapp.xcworkspace \
            -scheme fieldapp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            build

      - name: Build for Device (unsigned)
        if: github.event.inputs.build_type == 'device'
        working-directory: artifacts/field-app/ios
        run: |
          xcodebuild \
            -workspace fieldapp.xcworkspace \
            -scheme fieldapp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: invendis-field-app-ios-${{ github.event.inputs.build_type }}-${{ github.sha }}
          path: artifacts/field-app/ios/build/Build/Products/Release-*
          retention-days: 30
